<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Premium Homely Tiffin Service for Students and Working Professionals. Monthly Subscriptions & One-time Thali Orders." />
    
    <!-- Mobile App & PWA Meta Tags -->
    <meta name="theme-color" content="#0C3822" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bring My Bite" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons & Manifest -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

  <body class="bg-[#FAF7F2] text-[#1A261E] antialiased selection:bg-[#124E33] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('BringMyBite SW registered successfully'))
            .catch(err => console.log('SW registration error:', err));
        });
      }
    </script>
  </body>
